<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRE-STEP SUCCESS - Teacher Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .header-box { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #eee; }
    .brand-title { color: #2C3E50; margin: 0; font-size: 28px; letter-spacing: 1px; }
    .brand-tag { color: #E67E22; font-weight: bold; margin-top: 5px; font-size: 14px; }
    .stats { display: flex; gap: 15px; margin-bottom: 20px; justify-content: space-between; }
    .stat-card { flex: 1; background: #ebf5fb; padding: 15px; border-radius: 8px; text-align: center; border-left: 5px solid #3498db; }
    .stat-card h3 { margin: 0; font-size: 28px; color: #2980b9; }
    .stat-card p { margin: 5px 0 0; color: #555; font-size: 14px; }
    .filter-box { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
    input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; }
    .btn-action { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; font-size: 14px; }
    .btn-refresh { background: #2ecc71; }
    .btn-refresh:hover { background: #27ae60; }
    .btn-home { background: #3498db; }
    .btn-home:hover { background: #2980b9; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
    th { background: #3498db; color: white; }
    tr:nth-child(even) { background: #f9f9f9; }
    .badge-score { background: #d4edda; padding: 6px 12px; border-radius: 12px; font-weight: bold; color: #155724; border: 1px solid #c3e6cb; display: inline-block; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-box">
    <h2 class="brand-title">🚀 PRE-STEP SUCCESS</h2>
    <div class="brand-tag">Teacher's Quiz Record & Analytics Dashboard</div>
  </div>
  
  <div class="stats">
    <div class="stat-card">
      <h3 id="total-students">0</h3>
      <p>Total Quiz Attempts</p>
    </div>
    <div class="stat-card">
      <h3 id="top-topic">-</h3>
      <p>Latest Topic Active</p>
    </div>
  </div>

  <div class="filter-box">
    <input type="text" id="search-input" onkeyup="filterData()" placeholder="Search Student Name, Class, or Topic...">
    
    <button onclick="loadDashboardData()" class="btn-action btn-refresh" id="refresh-btn">
      🔄 Refresh
    </button>
    
    <a href="index.html" class="btn-action btn-home">
      🏠 Home Menu
    </a>
  </div>

  <table>
    <thead>
      <tr>
        <th>Date & Time</th>
        <th>Student Name</th>
        <th>Class</th>
        <th>Topic</th>
        <th>Score (%)</th>
      </tr>
    </thead>
    <tbody id="data-table">
      <tr><td colspan="5" style="text-align:center;">Loading records...</td></tr>
    </tbody>
  </table>
</div>

<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzTNkgKtHGSxey52910ebyG_3kMzGByUeqnGYDW5DLqq4inYeKPNU2fv0Xi8s3roKTamQ/exec";
  let allRecords = [];

  function loadDashboardData() {
    const btn = document.getElementById("refresh-btn");
    const tbody = document.getElementById("data-table");
    
    btn.innerText = "⏳ Loading...";
    btn.disabled = true;
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Refreshing records from Google Sheet...</td></tr>`;

    fetch(GOOGLE_SCRIPT_URL)
      .then(res => res.json())
      .then(data => {
        allRecords = data.reverse();
        document.getElementById("total-students").innerText = allRecords.length;
        if(allRecords.length > 0) {
          const first = allRecords[0];
          document.getElementById("top-topic").innerText = first.topic || first.Topic || "-";
        }
        renderTable(allRecords);
      })
      .catch(err => {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">Failed to load records from Google Sheet.</td></tr>`;
      })
      .finally(() => {
        btn.innerText = "🔄 Refresh";
        btn.disabled = false;
      });
  }

  function cleanScore(scoreVal) {
    if (!scoreVal) return "-";
    let str = String(scoreVal).trim();
    
    // Jika data mengandungi tanda '/' seperti '8/10'
    if (str.includes('/')) {
      const parts = str.split('/');
      const num = parseFloat(parts[0]);
      const den = parseFloat(parts[1]);
      if (!isNaN(num) && !isNaN(den) && den > 0) {
        const pct = Math.round((num / den) * 100);
        return `${num}/${den} (${pct}%)`;
      }
    }
    
    // Jika data nombor peratus biasa
    const val = parseFloat(str);
    if (!isNaN(val)) {
      return `${val}%`;
    }

    return str;
  }

  function renderTable(records) {
    const tbody = document.getElementById("data-table");
    tbody.innerHTML = "";

    if (records.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No student records found yet.</td></tr>`;
      return;
    }

    records.forEach(r => {
      // Ambil nilai mengikut kunci atau indeks
      const vals = Object.values(r);
      
      const rawDate = r.timestamp || r.Timestamp || r.dateTime || vals[0] || "";
      let dateFormatted = "-";
      if(rawDate) {
        const d = new Date(rawDate);
        dateFormatted = !isNaN(d.getTime()) ? d.toLocaleString("en-GB") : rawDate;
      }

      const name = r.studentName || r.studentname || r.StudentName || vals[1] || "-";
      const cls = r.className || r.classname || r.Class || vals[2] || "-";
      const topic = r.topic || r.Topic || vals[3] || "-";
      const score = cleanScore(r.score || r.Score || vals[4]);

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${dateFormatted}</td>
        <td><b>${name}</b></td>
        <td>${cls}</td>
        <td>${topic}</td>
        <td><span class="badge-score">${score}</span></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function filterData() {
    const query = document.getElementById("search-input").value.toLowerCase();
    const filtered = allRecords.filter(r => {
      const vals = Object.values(r);
      const name = String(r.studentName || r.studentname || vals[1] || "").toLowerCase();
      const cls = String(r.className || r.classname || vals[2] || "").toLowerCase();
      const topic = String(r.topic || r.Topic || vals[3] || "").toLowerCase();
      return name.includes(query) || cls.includes(query) || topic.includes(query);
    });
    renderTable(filtered);
  }

  loadDashboardData();
</script>
</body>
</html>
