<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRE-STEP SUCCESS - Action Verbs Quiz</title>
  <style>
    * { box-sizing: border-box; font-family: 'Comic Sans MS', Arial, sans-serif; }
    body { background-color: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #fff; width: 100%; max-width: 550px; border-radius: 20px; padding: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); text-align: center; border: 4px solid #3498DB; }
    .brand-title { color: #2C3E50; margin: 0; font-size: 26px; }
    .brand-tag { color: #E67E22; font-weight: bold; margin-top: 2px; font-size: 14px; }
    input, select { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #ccc; border-radius: 8px; font-size: 16px; }
    .btn { padding: 12px 25px; font-size: 18px; font-weight: bold; background: #2ECC71; color: white; border: none; border-radius: 25px; cursor: pointer; margin-top: 15px; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .img-box { width: 100%; height: 230px; display: flex; justify-content: center; align-items: center; background: #fafafa; border-radius: 12px; border: 2px dashed #ccc; margin: 15px 0; overflow: hidden; padding: 10px; }
    .img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .drop-zone { width: 80%; height: 50px; border: 3px dashed #3498DB; background: #EBF5FB; border-radius: 10px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
    .drop-zone.correct { background: #D4EDDA; border-color: #28A745; color: #155724; }
    .drop-zone.wrong { background: #F8D7DA; border-color: #DC3545; color: #721C24; }
    .word-bank { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
    .btn-word { padding: 10px 18px; background: #E67E22; color: white; border-radius: 20px; font-size: 16px; font-weight: bold; cursor: grab; user-select: none; }
    .hidden { display: none; }
  </style>
</head>
<body>

<!-- STUDENT INFO SCREEN -->
<div class="card" id="start-screen">
  <h2 class="brand-title">🚀 PRE-STEP SUCCESS</h2>
  <div class="brand-tag">Step-by-Step Primary English Mastery</div>
  <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">
  
  <h3>🎮 Action Verbs Quiz</h3>
  <p style="color: #666; font-size: 14px;">Get Smart Plus 3: Unit 3 (Right Now)</p>
  
  <input type="text" id="student-name" placeholder="Enter Full Name..." required>
  <input type="text" id="student-class" placeholder="Enter Class (e.g. 3 Cerdik)..." required>
  
  <button class="btn" onclick="startQuiz()">Start Quiz ➔</button>
</div>

<!-- QUIZ SCREEN -->
<div class="card hidden" id="quiz-screen">
  <h3 id="q-header">Question 1 / 10</h3>
  
  <div class="img-box">
    <img id="q-img" src="" alt="Action Verb Image">
  </div>
  
  <p>Drag or tap the correct action verb:</p>
  
  <div class="drop-zone" id="drop-zone" ondrop="handleDrop(event)" ondragover="allowDrop(event)">
    Drop answer here
  </div>

  <div class="word-bank" id="word-bank"></div>

  <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>Next Question ➔</button>
</div>

<!-- RESULT SCREEN -->
<div class="card hidden" id="result-screen">
  <h2>🎉 Well Done! 🎉</h2>
  <p id="result-message">Submitting your score to teacher's record...</p>
  <h3 id="final-score">Score: 0 / 10</h3>
  <button class="btn" onclick="location.reload()">Try Again 🔄</button>
</div>

<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzTNkgKtHGSxey52910ebyG_3kMzGByUeqnGYDW5DLqq4inYeKPNU2fv0Xi8s3roKTamQ/exec";
  const TOPIC_NAME = "Year 3 Unit 3: Action Verbs";

  const questions = [
    { num: 1, answer: "run", img: "https://img.icons8.com/color/240/running.png", options: ["run", "walk", "jump"] },
    { num: 2, answer: "walk", img: "https://img.icons8.com/color/240/walking.png", options: ["run", "walk", "dance"] },
    { num: 3, answer: "swim", img: "https://img.icons8.com/color/240/swimming.png", options: ["swim", "sing", "sleep"] },
    { num: 4, answer: "read", img: "https://img.icons8.com/color/240/reading.png", options: ["write", "read", "eat"] },
    { num: 5, answer: "eat", img: "https://img.icons8.com/color/240/restaurant-menu.png", options: ["eat", "read", "sing"] },
    { num: 6, answer: "write", img: "https://img.icons8.com/color/240/writing.png", options: ["write", "read", "walk"] },
    { num: 7, answer: "jump", img: "https://img.icons8.com/color/240/jumping.png", options: ["jump", "run", "swim"] },
    { num: 8, answer: "sleep", img: "https://img.icons8.com/color/240/sleeping-in-bed.png", options: ["sleep", "dance", "eat"] },
    { num: 9, answer: "sing", img: "https://img.icons8.com/color/240/singing.png", options: ["sing", "dance", "read"] },
    { num: 10, answer: "dance", img: "https://img.icons8.com/color/240/dancing.png", options: ["dance", "sing", "jump"] }
  ];

  let currentIdx = 0;
  let score = 0;
  let studentName = "";
  let studentClass = "";

  function startQuiz() {
    studentName = document.getElementById("student-name").value.trim();
    studentClass = document.getElementById("student-class").value.trim();

    if (!studentName || !studentClass) {
      alert("Please enter your Student Name and Class first!");
      return;
    }

    document.getElementById("start-screen").classList.add("hidden");
    document.getElementById("quiz-screen").classList.remove("hidden");
    loadQuestion();
  }

  function loadQuestion() {
    const q = questions[currentIdx];
    document.getElementById("q-header").innerText = `Question ${currentIdx + 1} of ${questions.length}`;
    document.getElementById("q-img").src = q.img;
    
    const zone = document.getElementById("drop-zone");
    zone.innerText = "Drop answer here";
    zone.className = "drop-zone";
    document.getElementById("next-btn").disabled = true;

    const bank = document.getElementById("word-bank");
    bank.innerHTML = "";
    q.options.sort(() => Math.random() - 0.5).forEach(word => {
      const el = document.createElement("div");
      el.innerText = word;
      el.className = "btn-word";
      el.draggable = true;
      el.ondragstart = (e) => e.dataTransfer.setData("text", word);
      el.onclick = () => checkAnswer(word);
      bank.appendChild(el);
    });
  }

  function allowDrop(ev) { ev.preventDefault(); }
  function handleDrop(ev) {
    ev.preventDefault();
    const word = ev.dataTransfer.getData("text");
    if (word) checkAnswer(word);
  }

  function checkAnswer(userAnswer) {
    const q = questions[currentIdx];
    const zone = document.getElementById("drop-zone");
    zone.innerText = userAnswer;

    if (userAnswer === q.answer) {
      zone.className = "drop-zone correct";
      document.getElementById("next-btn").disabled = false;
      score++;
    } else {
      zone.className = "drop-zone wrong";
      document.getElementById("next-btn").disabled = true;
    }
  }

  function nextQuestion() {
    currentIdx++;
    if (currentIdx < questions.length) {
      loadQuestion();
    } else {
      finishQuiz();
    }
  }

  function finishQuiz() {
    document.getElementById("quiz-screen").classList.add("hidden");
    document.getElementById("result-screen").classList.remove("hidden");
    document.getElementById("final-score").innerText = `Your Score: ${score} / ${questions.length}`;

    // HANTAR DATA DENGAN KEY SAMA SEPERTI DI GOOGLE SCRIPT
    const payload = {
      studentName: studentName,
      className: studentClass,
      topic: TOPIC_NAME,
      score: `${score}/${questions.length}`
    };

    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(() => {
      document.getElementById("result-message").innerText = "Your score has been successfully submitted!";
    }).catch(err => {
      document.getElementById("result-message").innerText = "Failed to submit record automatically.";
    });
  }
</script>
</body>
</html>
